services:
  stans-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: stans-app:latest
    container_name: stans-app
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - stans-network

networks:
  stans-network:
    driver: bridge
