services:
  stans-app:
    image: ${DOCKER_IMAGE:-stans-app:latest}
    container_name: stans-production-app
    restart: always
    ports:
      # Binds only to local loopback; Host Nginx terminates SSL on 443 and proxies here
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    networks:
      - stans-prod-net

networks:
  stans-prod-net:
    driver: bridge
