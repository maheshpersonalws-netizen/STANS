name: STANS CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

permissions:
  contents: read
  packages: write

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Basic Validation & Build Verification
  # ----------------------------------------------------------------------------
  validate:
    name: Validate Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Application Build
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=2048"

  # ----------------------------------------------------------------------------
  # Job 2: Build & Push Docker Image
  # ----------------------------------------------------------------------------
  docker-build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Lowercase Image Name
        id: prep
        run: |
          LOW_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$LOW_NAME" >> $GITHUB_ENV

      # GitHub Container Registry (ghcr.io) Login (Uses default GITHUB_TOKEN)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Optional Docker Hub Login (Active if user sets DOCKERHUB_USERNAME secret)
      - name: Log in to Docker Hub (Optional)
        if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and Push image to GHCR
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # Job 3: Automated Server Deployment (Optional - Runs when SSH secrets exist)
  # ----------------------------------------------------------------------------
  deploy-remote:
    name: Deploy to Cloud Server
    runs-on: ubuntu-latest
    needs: [docker-build-push]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check SSH Configuration
        id: check_ssh
        run: |
          if [ -n "${{ secrets.SSH_HOST }}" ]; then
            echo "SSH_HOST secret is present. Proceeding with deployment."
            echo "deploy=true" >> $GITHUB_OUTPUT
          else
            echo "SSH_HOST secret is not set. Skipping SSH deployment."
            echo "deploy=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via SSH
        if: steps.check_ssh.outputs.deploy == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            LOW_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            echo "Pulling latest STANS container..."
            docker pull ghcr.io/${LOW_NAME}:latest
            
            echo "Stopping old container..."
            docker stop stans-app || true
            docker rm stans-app || true
            
            echo "Starting new container..."
            docker run -d \
              --name stans-app \
              --restart=always \
              -p 8080:80 \
              ghcr.io/${LOW_NAME}:latest
            
            echo "Verifying health check..."
            sleep 5
            curl -f http://127.0.0.1:8080/health && echo "Deployment successful!"
